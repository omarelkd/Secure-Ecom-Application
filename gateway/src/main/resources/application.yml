server:
  port: 8085

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # Configuration handled by custom ReactiveJwtDecoder bean
          # to skip issuer validation

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: product-service
              uri: http://product_service:8081
              predicates:
                - Path=/products/**
              filters:
                - PreserveHostHeader

            - id: order-service
              uri: http://order_service:8082
              predicates:
                - Path=/orders/**
              filters:
                - PreserveHostHeader
