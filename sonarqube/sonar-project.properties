# Fichier de configuration pour SonarQube Scanner
# À placer à la racine du projet ou dans le répertoire de chaque service

sonar.projectName=Secure-Ecom-Application
sonar.projectVersion=1.0.0
sonar.language=java
sonar.sources=.

# Inclure le code source
sonar.inclusions=src/**

# Exclure les fichiers de test et de dépendances
sonar.exclusions=**/target/**, **/node_modules/**, **/*.test.js, **/*.test.ts

# Patterns d'exclusion pour les répertoires de test
sonar.exclusions=**/src/test/**,**/test/**

# Inclure les tests dans l'analyse
sonar.tests=src/test
sonar.test.inclusions=**/*Test.java,**/*Tests.java

# Configuration JaCoCo pour la couverture de code
sonar.java.coveragePlugin=jacoco
sonar.jacoco.reportPaths=target/jacoco.exec

# Sécurité - Activez les règles de sécurité
sonar.host.url=http://localhost:9000
sonar.login=admin
sonar.password=admin
